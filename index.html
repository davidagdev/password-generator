<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="title">Generador de contraseñas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 data-key="title">Generador de contraseñas</h1>
        <button type="button" id="lang-btn" class="lang-btn">EN</button>
    </header>
    <nav>
        <div class="option-group">
            <label for="simbol" data-key="simbols">Caracteres especiales</label>
            <input type="checkbox" checked id="simbol">
        </div>

        <div class="option-group">
            <label for="num" data-key="numbers">Números</label>
            <input type="checkbox" checked id="num">
        </div>

        <div class="option-group">
            <label for="mayus" data-key="uppercase">Mayúsculas</label>
            <input type="checkbox" checked id="mayus">
        </div>

        <div class="option-group">
            <label for="minus" data-key="lowercase">Minúsculas</label>
            <input type="checkbox" checked id="minus">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <label for="slider" data-key="length">Longitud contraseña</label>
                <output id="slider-val">12</output>
            </div>
            <input type="range" value="12" min="4" max="25" class="slider" id="slider" oninput="document.getElementById('slider-val').value = this.value">
        </div>
    </nav>
    <main>
        <button type="button" id="generate" class="action-btn" data-key="generate">Generar contraseña</button>
        <output>
            <p data-key="placeholder">Click en el botón generar contraseña</p>
        </output>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
